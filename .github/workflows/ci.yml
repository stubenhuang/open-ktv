name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 项目要求 Node ≥ 22.6（node:sqlite + 原生 TS 类型擦除）
          node-version: '22'
          cache: npm

      # 测试要用 ffmpeg 造素材、量混响尾音。ubuntu-latest 镜像自带，
      # 这里显式打一版版本号：缺了它的时候失败信息是「ffmpeg 启动失败」，
      # 看不出是环境问题。
      - name: 确认 ffmpeg / ffprobe 在位
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - run: npm ci

      - name: 类型检查（前端 + 服务端两份 tsconfig）
        run: npm run typecheck

      # 单元测试全程不碰外网：5sing / 酷狗都有本地桩（见 tests/*.test.ts）。
      # 不跑 test:e2e —— 那个要真实 Chrome 和显示环境。
      - name: 单元测试
        run: npm test

      # 文案目录的一致性：键集、占位符、服务端错误码、源码里的键引用。
      # 动过界面文案时这里必须过（详见 CONTRIBUTING.md 的 i18n 一节）。
      - name: i18n 目录检查
        run: npm run check:i18n

      # 每个源文件都带 SPDX 许可头（MIT）。新增文件别忘了加 ——
      # 见 scripts/check-license-headers.mjs。
      - name: 许可头检查
        run: npm run check:license

      # 浏览器级的语言切换烟测：headless Chrome 打开 build 产物，验首屏语言、
      # 切换、localStorage 记忆、?lang= 覆盖与 <html lang> 同步。
      # ubuntu-latest 镜像自带 Chrome；脚本自己会找可执行文件，找不到就说清楚。
      - name: 界面语言烟测
        run: |
          npm run build
          npm run smoke:i18n
