name: Bug report
description: 报告一个问题 / Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认：已经在 [Issues](https://github.com/stubenhuang/open-ktv/issues) 里搜过、
        `npm run typecheck` 与 `npm test` 都能过、且用的是最新代码。

        Before filing: search existing issues, make sure `npm run typecheck` and `npm test`
        pass, and reproduce on the latest code.

        安全问题请不要走这个模板，见 [SECURITY.md](../blob/main/SECURITY.md)。
        Security issues must **not** use this template — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 描述现象，以及你本来期望的结果。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 上传一个 flac 伴奏
        2. 去演唱页点「开始演唱」
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Open KTV 版本 / Version
      placeholder: '0.1.0 或 commit sha'
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 出问题的界面 / Affected surface
      options:
        - 伴奏库 / Library
        - 点歌台 / Discover
        - 演唱页 / Sing
        - 作品库 / Works
        - 作品编辑页 / Work detail
        - 分段重录 / Re-take
        - 手机端 / Mobile (/m)
        - 启动脚本 / openktv.sh
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / OS
      placeholder: 'macOS 15.1 / Ubuntu 24.04 / Windows 11'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器 / Browser
      placeholder: 'Chrome 131 / Edge 131 / Safari 18'
    validations:
      required: false

  - type: input
    id: node
    attributes:
      label: Node / ffmpeg 版本 / Node & ffmpeg versions
      placeholder: 'node v24.2.0, ffmpeg 7.1'
    validations:
      required: false

  - type: dropdown
    id: interface-language
    attributes:
      label: 界面语言 / Interface language
      description: 如果是文案或翻译问题，请说明用的是哪种语言。
      options:
        - 简体中文 (zh-CN)
        - English (en)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: '`./openktv.sh logs` 的输出，或浏览器控制台。请去掉隐私信息。'
      render: shell
