name: Feature request
description: 提一个新功能 / Suggest a feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说明「想解决什么问题」，再谈「想怎么实现」——前者决定了这个功能值不值得做。

        Describe the problem first and the implementation second; the problem decides whether
        the feature is worth building.

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 你在唱歌 / 用这个工具的时候，哪一步让你觉得麻烦？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: 相关的界面 / Related surface
      options:
        - 伴奏库 / Library
        - 点歌台 / Discover
        - 演唱页 / Sing
        - 作品库 / Works
        - 作品编辑页 / Work detail
        - 分段重录 / Re-take
        - 手机端 / Mobile (/m)
        - 国际化 / i18n
        - 部署 / Deployment
        - 其他 / Other
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已经搜过现有的 Issues，没有重复。
          required: true
        - label: 我愿意为这个功能提交 Pull Request。（可选）
